<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | NAF LMS</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: "Helvetica Neue", Arial, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: radial-gradient(circle at 25% 20%, #0b1530, #0f1c3b 35%, #0a1229),
          radial-gradient(circle at 80% 0%, rgba(255, 255, 255, 0.06), transparent 35%),
          #0a0f1f;
        color: #f6f7fb;
        text-align: center;
        padding: 24px;
      }
      .card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 28px 24px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(8px);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        letter-spacing: 0.2px;
      }
      p {
        margin: 0 0 20px;
        color: rgba(246, 247, 251, 0.78);
        line-height: 1.6;
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-size: 14px;
        font-weight: 600;
        transition: transform 0.1s ease, box-shadow 0.2s ease;
      }
      .primary {
        background: linear-gradient(135deg, #0e5ad1, #083b8a);
        color: #fdfdfd;
        box-shadow: 0 12px 32px rgba(8, 59, 138, 0.35);
      }
      .secondary {
        background: rgba(255, 255, 255, 0.12);
        color: #f6f7fb;
        border: 1px solid rgba(255, 255, 255, 0.16);
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are currently offline</h1>
      <p>
        We could not reach the NAF LMS servers. Reconnect to the internet and reload the page. Content you already
        opened will resume once you are back online.
      </p>
      <div class="actions">
        <button class="primary" onclick="window.location.reload()">Try again</button>
        <button class="secondary" onclick="window.history.back()">Go back</button>
      </div>
    </main>
  </body>
</html>
